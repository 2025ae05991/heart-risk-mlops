[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heart-risk-mlops"
version = "1.0.0"
description = "UCI Cleveland classifier with reproducible MLOps and Docker Desktop Kubernetes"
requires-python = ">=3.11,<3.13"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
heartml = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Report prose remains readable as complete string literals.
"tools/build_report.py" = ["E501"]

